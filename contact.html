<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - NeoSmith Hobby</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <a href="index.html">NeoSmith Hobby</a>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="consultations.html">Consultations</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="manga.html">Manga</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            <div class="burger">
                <div class="line1"></div>
                <div class="line2"></div>
                <div class="line3"></div>
            </div>
        </nav>
    </header>

    <main>
        <section class="contact-section">
            <h1>Contact Us</h1>
            <p>Have a question or a project in mind? Reach out to us!</p>
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>
                <button type="submit" class="cta-button">Send Message</button>
            </form>
        </section>
    </main>

    <footer>
        <div class="social-media">
            <a href="#"><img src="assets/icons/youtube.svg" alt="YouTube"></a>
            <a href="#"><img src="assets/icons/instagram.svg" alt="Instagram"></a>
            <a href="#"><img src="assets/icons/tiktok.svg" alt="TikTok"></a>
            <a href="#"><img src="assets/icons/twitter.svg" alt="Twitter"></a>
        </div>
        <p>&copy; 2024 NeoSmith Hobby. All Rights Reserved.</p>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
