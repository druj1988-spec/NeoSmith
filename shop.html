<!DOCTYPE html>
<html lang="en">

    <header>
        <nav>

                <a href="index.html">NeoSmith Hobby</a>

                <div class="line2"></div>

    <main>
        <section class="shop-section">
            <h1>Digital Assets</h1>
            <div class="product-grid">

                <div class="product-card">

                </div>

                <div class="product-card">
                    <img src="assets/images/product2.jpg" alt="Product 2">

                    <p>Price: 0.05 ETH</p>
                    <button class="buy-button">Buy Now</button>
                </div>
                <!-- ... more products -->
            </div>
            <div class="crypto-checkout">
                <p>Checkout with:</p>
                <button id="metamask-button">MetaMask</button>
                <button id="betastorage-button">Betastorage.x</button>

    <footer>
        <div class="social-media">
            <a href="#"><img src="assets/icons/youtube.svg" alt="YouTube"></a>
